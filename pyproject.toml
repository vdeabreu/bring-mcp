[project]
name = "bring-mcp"
version = "0.1.1"
description = "MCP server for Bring! shopping lists (local stdio or remote claude.ai connector)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Victor De Abreu" }]
requires-python = ">=3.12"
keywords = ["mcp", "mcp-server", "bring", "shopping-list", "groceries", "recipes", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp==2.3.0",
    # Pinned: bring_client.py uses a few private attributes of bring-api.
    "bring-api==1.1.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/vdeabreu/bring-mcp"
Issues = "https://github.com/vdeabreu/bring-mcp/issues"

[project.scripts]
bring-mcp = "bring_mcp.__main__:main"
bring-mcp-remote = "bring_mcp.server:main"
bring-mcp-staples = "bring_mcp.staples:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bring_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
