[project]
name = "bring-mcp"
version = "0.1.0"
description = "MCP server for Bring! shopping lists (local stdio or remote claude.ai connector)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    # Pinned: bring_client.py uses a few private attributes of bring-api.
    "bring-api==1.1.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bring-mcp = "bring_mcp.__main__:main"
bring-mcp-remote = "bring_mcp.server:main"
bring-mcp-staples = "bring_mcp.staples:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bring_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
