services:
  bring-mcp:
    build: .
    container_name: bring-mcp
    env_file: .env
    environment:
      # Inside its own container network the server has to listen on all interfaces;
      # the port is only published on the host's loopback, for the reverse proxy.
      LISTEN_HOST: 0.0.0.0
      ALLOW_NON_LOOPBACK_LISTEN: "true"
      # Requests arrive from the Docker gateway (172.16.0.0/12 is Docker's default
      # pool), not 127.0.0.1. Never use "*": uvicorn would then take the leftmost
      # X-Forwarded-For value, which any client can set, and log a forged address.
      FORWARDED_ALLOW_IPS: 172.16.0.0/12
    ports:
      - 127.0.0.1:8765:8765
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
